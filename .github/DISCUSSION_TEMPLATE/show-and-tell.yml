title: "[Showcase] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Good automations get added to the [Showcase](https://github.com/tempus2016/tabdeck-companion/wiki/Showcase) wiki page (with credit), so other people can copy the idea.
        Please remove anything private from screenshots and YAML (addresses, camera views, names you'd rather not share).
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images or a short GIF here.
  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: A sentence or two, e.g. "The hall tablet switches to the cameras tab when someone rings the doorbell, and back to home after a minute."
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Automation YAML
      description: The automation, script or template that uses the select entity or usage sensor. It's formatted as YAML automatically.
      render: yaml
  - type: dropdown
    id: device
    attributes:
      label: Where is it used?
      multiple: true
      options:
        - Phone
        - Tablet / wall panel
        - Desktop
  - type: checkboxes
    id: consent
    attributes:
      label: Showcase
      options:
        - label: It's OK to feature this on the Showcase wiki page with credit to my GitHub username.
